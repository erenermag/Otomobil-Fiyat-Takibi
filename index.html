<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sıfır Araç Fiyat Takibi</title>
  <meta name="description" content="Türkiye'de sıfır araç liste fiyatlarının haftalık takibi.">
  <!-- CSS ve JS bu dosyanın içinde: önbellekte eski/yeni dosya karışmasın diye tek dosya -->
  <style>
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --text: #1b1f24;
  --muted: #5f6b7a;
  --line: #e3e6ea;
  --accent: #2563eb;
  --up: #c62828;
  --down: #2e7d32;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418;
    --card: #1a1f25;
    --text: #e8ebef;
    --muted: #9aa5b1;
    --line: #2a313a;
    --accent: #6ea0ff;
    --up: #ff6b6b;
    --down: #5fd38a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
.top { border-bottom: 1px solid var(--line); background: var(--card); padding: 20px 0 14px; }
.top h1 { margin: 0; font-size: 1.5rem; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }

.top h1 a { color: inherit; text-decoration: none; }
.crumbs { margin: 18px 0 0; font-size: .9rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs:empty { display: none; }
.crumbs .sep { opacity: .6; }
.title { font-size: 1.3rem; margin: 14px 0 14px; }

.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tile {
  display: flex; flex-direction: column; gap: 4px; padding: 18px 16px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  color: var(--text); text-decoration: none; transition: border-color .15s, transform .15s;
}
.tile:hover, .tile:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
.tile-name { font-size: 1.15rem; font-weight: 650; }
.tile-detail { font-size: .82rem; color: var(--muted); }
.tile-price { font-size: .95rem; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile-price small { display: block; font-weight: 400; font-size: .78rem; color: var(--muted); }

.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
}
.card h3 { margin: 0; font-size: 1.05rem; }
.lbl { font-size: .75rem; font-weight: 500; color: var(--muted); }
.camp { font-size: .88rem; color: var(--down); }
.meta { color: var(--muted); font-size: .82rem; }
.price { font-size: 1.45rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.chg { font-size: .85rem; font-weight: 600; }
.chg.up { color: var(--up); }
.chg.down { color: var(--down); }
.chg.flat { color: var(--muted); }
.chart { margin: 6px 0 2px; }
.chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; -webkit-tap-highlight-color: transparent; user-select: none; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .yl { fill: var(--muted); font-size: 10px; text-anchor: end; font-variant-numeric: tabular-nums; }
.chart .xl { fill: var(--muted); font-size: 10px; text-anchor: middle; }
.chart .ln { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .list-ln { stroke: var(--accent); }
.chart .camp-ln { stroke: var(--down); stroke-dasharray: 5 4; }
.chart .list-dt { fill: var(--accent); stroke: var(--card); stroke-width: 1.5; }
.chart .camp-dt { fill: var(--down); stroke: var(--card); stroke-width: 1.5; }
.chart .cursor { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .hit { fill: transparent; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
.legend { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); margin-top: 2px; }
.legend span::before { content: ""; display: inline-block; width: 16px; height: 0; vertical-align: middle; margin-right: 5px; border-top: 2.5px solid; }
.lg-list::before { border-color: var(--accent) !important; }
.lg-camp::before { border-color: var(--down) !important; border-top-style: dashed !important; }
.readout { font-size: .82rem; color: var(--muted); min-height: 1.4em; margin-top: 2px; }
.readout b { color: var(--text); font-weight: 600; }
.camp-txt { color: var(--down); }
.chart-note { font-size: .8rem; color: var(--muted); font-style: italic; }
th { text-align: left; font-weight: 600; color: var(--muted); padding: 3px 0; font-size: .78rem; }
th:not(:first-child), td:not(:first-child) { text-align: right; }
.empty { color: var(--muted); font-style: italic; }

details { font-size: .85rem; }
summary { cursor: pointer; color: var(--accent); }
table { width: 100%; border-collapse: collapse; margin-top: 6px; }
td { padding: 3px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
td:last-child { text-align: right; }
a { color: var(--accent); }

.foot { color: var(--muted); font-size: .8rem; padding: 28px 16px 40px; }
.msg { color: var(--muted); padding: 30px 0; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1><a href="#" class="home">Sıfır Araç Fiyat Takibi</a></h1>
      <p class="sub">Donanım bazında liste ve kampanyalı fiyatlar · haftalık güncellenir · <span id="updated">…</span></p>
    </div>
  </header>

  <main class="wrap">
    <nav id="crumbs" class="crumbs" aria-label="Konum"></nav>
    <h2 id="title" class="title"></h2>
    <div id="list" aria-live="polite"></div>
  </main>

  <footer class="wrap foot">
    Fiyatlar markaların yayımladığı aylık fiyat listelerinden derlenir; her fiyatın kaynak linki kartta yer alır.
    Kesin fiyat için yetkili bayiye danışın.
  </footer>

  <script>
(() => {
  const TL = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 0 });
  const DATE = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmtDate = (d) => DATE.format(new Date(d + "T00:00:00"));
  const sortTr = (arr) => [...new Set(arr)].sort((a, b) => a.localeCompare(b, "tr"));

  // Adres: #marka=Fiat&model=Egea+Cross (paylaşılabilir, geri tuşu çalışır)
  const link = (brand, model) => {
    const p = new URLSearchParams();
    if (brand) p.set("marka", brand);
    if (model) p.set("model", model);
    const s = p.toString();
    return s ? `#${s}` : "#";
  };

  let cars = [];

  function enrich(car) {
    const p = car.prices || [];
    const last = p[p.length - 1] || null;
    const prev = p.length > 1 ? p[p.length - 2] : null;
    const change = last && prev ? (last.price - prev.price) / prev.price : null;
    return { ...car, last, prev, change };
  }

  const minPrice = (list) => {
    const vals = list.filter((c) => c.last).map((c) => c.last.price);
    return vals.length ? Math.min(...vals) : null;
  };

  const MONTH = new Intl.DateTimeFormat("tr-TR", { month: "short" });
  const MONTH_LONG = new Intl.DateTimeFormat("tr-TR", { month: "long", year: "numeric" });
  const mn = (v) => (v / 1e6).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " mn";

  // Fiyat geçmişi grafiği: liste (düz çizgi) + kampanyalı (kesikli çizgi)
  function chart(prices) {
    if (prices.length < 2) return `<div class="chart-note">Grafik için en az iki aylık fiyat gerekiyor.</div>`;
    const W = 320, H = 150, L = 50, R = 12, T = 12, B = 24;
    const all = prices.flatMap((p) => (p.campaign ? [p.price, p.campaign] : [p.price]));
    let lo = Math.min(...all), hi = Math.max(...all);
    const padY = (hi - lo) * 0.12 || hi * 0.03;
    lo -= padY; hi += padY;
    const x = (i) => L + (i * (W - L - R)) / (prices.length - 1);
    const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    const ticks = [hi - padY, (hi + lo) / 2, lo + padY];

    const grid = ticks.map((v) =>
      `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
       <text class="yl" x="${L - 6}" y="${(y(v) + 3.5).toFixed(1)}">${mn(v)}</text>`).join("");
    const xl = prices.map((p, i) =>
      `<text class="xl" x="${x(i).toFixed(1)}" y="${H - 6}">${esc(MONTH.format(new Date(p.date + "T00:00:00")))}</text>`).join("");
    const line = (pts, cls) => pts.length > 1
      ? `<path class="${cls}" d="${pts.map(([i, v], k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}"/>` : "";
    const listPts = prices.map((p, i) => [i, p.price]);
    const campPts = prices.map((p, i) => [i, p.campaign]).filter(([, v]) => v);
    const dots = (pts, cls) => pts.map(([i, v]) =>
      `<circle class="${cls}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5"/>`).join("");
    // Dokunma alanları: her ay için görünmez bir sütun
    const hits = prices.map((p, i) => {
      const w = (W - L - R) / Math.max(prices.length - 1, 1);
      return `<rect class="hit" data-i="${i}" x="${(x(i) - w / 2).toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}"/>`;
    }).join("");

    return `<div class="chart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fiyat geçmişi grafiği">
        ${grid}${xl}
        ${line(campPts, "ln camp-ln")}${line(listPts, "ln list-ln")}
        ${dots(campPts, "dt camp-dt")}${dots(listPts, "dt list-dt")}
        <line class="cursor" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
        ${hits}
      </svg>
      <div class="legend"><span class="lg-list">Liste</span>${campPts.length ? `<span class="lg-camp">Kampanyalı</span>` : ""}</div>
      <div class="readout">Ay üzerine dokunarak fiyatı görün</div>
    </div>`;
  }

  // Grafikte bir aya dokunulunca/üzerine gelinince o ayın fiyatını göster
  function showPoint(rect) {
    const cardEl = rect.closest(".card");
    const c = cars.find((x) => x.id === cardEl.dataset.id);
    const p = c.prices[+rect.dataset.i];
    const cx = +rect.getAttribute("x") + +rect.getAttribute("width") / 2;
    const cur = cardEl.querySelector(".cursor");
    cur.setAttribute("x1", cx); cur.setAttribute("x2", cx); cur.setAttribute("visibility", "visible");
    cardEl.querySelector(".readout").innerHTML =
      `<b>${esc(MONTH_LONG.format(new Date(p.date + "T00:00:00")))}</b>: ${TL.format(p.price)}` +
      (p.campaign ? ` · <span class="camp-txt">kampanyalı ${TL.format(p.campaign)}</span>` : "");
  }

  function changeBadge(c) {
    if (c.change === null) return c.last ? `<span class="chg flat">ilk kayıt</span>` : "";
    const pct = Math.abs(c.change * 100).toFixed(1).replace(".", ",");
    const diff = TL.format(Math.abs(c.last.price - c.prev.price));
    if (c.change > 0) return `<span class="chg up">▲ %${pct} (+${diff})</span>`;
    if (c.change < 0) return `<span class="chg down">▼ %${pct} (−${diff})</span>`;
    return `<span class="chg flat">değişmedi</span>`;
  }

  // Marka / model seçim kutusu
  function tile(href, name, detail, price) {
    return `<a class="tile" href="${href}">
      <span class="tile-name">${esc(name)}</span>
      <span class="tile-detail">${esc(detail)}</span>
      ${price !== null ? `<span class="tile-price"><small>başlangıç fiyatı</small>${TL.format(price)}</span>` : ""}
    </a>`;
  }

  // Donanım kartı
  function card(c) {
    const spec = [c.engine, c.fuel, c.transmission].filter(Boolean).map(esc).join(" · ");
    const campaign = c.last?.campaign
      ? `<div class="camp">Kampanyalı: <b>${TL.format(c.last.campaign)}</b> (−${TL.format(c.last.price - c.last.campaign)})</div>`
      : "";
    const body = c.last
      ? `<div class="price">${TL.format(c.last.price)} <span class="lbl">liste</span></div>
         ${campaign}
         ${changeBadge(c)}
         ${chart(c.prices)}
         <div class="meta">${fmtDate(c.last.date)} · <a href="${esc(c.last.source)}" target="_blank" rel="noopener">kaynak</a></div>
         <details><summary>Fiyat geçmişi tablosu (${c.prices.length})</summary>
           <table><tr><th>Tarih</th><th>Liste</th><th>Kampanyalı</th></tr>${[...c.prices].reverse().map((p) =>
             `<tr><td>${fmtDate(p.date)}</td><td><a href="${esc(p.source)}" target="_blank" rel="noopener">${TL.format(p.price)}</a></td><td>${p.campaign ? TL.format(p.campaign) : "—"}</td></tr>`
           ).join("")}</table>
         </details>`
      : `<div class="empty">Henüz fiyat girilmedi.</div>`;
    return `<article class="card" data-id="${esc(c.id)}">
      <h3>${esc(c.trim || "Standart")}</h3>
      ${spec ? `<div class="meta">${spec}</div>` : ""}
      ${body}
    </article>`;
  }

  function render() {
    const p = new URLSearchParams(location.hash.slice(1));
    let brand = p.get("marka") || "";
    let model = p.get("model") || "";
    if (!cars.some((c) => c.brand === brand)) brand = model = "";
    if (!cars.some((c) => c.brand === brand && c.model === model)) model = "";

    const crumbs = [`<a href="#">Markalar</a>`];
    if (brand) crumbs.push(model ? `<a href="${link(brand)}">${esc(brand)}</a>` : `<span>${esc(brand)}</span>`);
    if (model) crumbs.push(`<span>${esc(model)}</span>`);
    $("crumbs").innerHTML = brand ? crumbs.join(`<span class="sep">›</span>`) : "";

    if (!brand) {
      // 1. adım: markalar
      $("title").textContent = "Marka seçin";
      $("list").innerHTML = `<div class="tiles">${sortTr(cars.map((c) => c.brand)).map((b) => {
        const items = cars.filter((c) => c.brand === b);
        const n = new Set(items.map((c) => c.model)).size;
        return tile(link(b), b, `${n} model`, minPrice(items));
      }).join("")}</div>`;
    } else if (!model) {
      // 2. adım: seçilen markanın modelleri
      $("title").textContent = `${brand} · model seçin`;
      const inBrand = cars.filter((c) => c.brand === brand);
      $("list").innerHTML = `<div class="tiles">${sortTr(inBrand.map((c) => c.model)).map((m) => {
        const items = inBrand.filter((c) => c.model === m);
        return tile(link(brand, m), m, `${items.length} donanım`, minPrice(items));
      }).join("")}</div>`;
    } else {
      // 3. adım: modelin donanımları (fiyata göre artan)
      const items = cars
        .filter((c) => c.brand === brand && c.model === model)
        .sort((a, b) => (a.last?.price ?? Infinity) - (b.last?.price ?? Infinity));
      $("title").textContent = `${brand} ${model}`;
      $("list").innerHTML = `<div class="grid">${items.map(card).join("")}</div>`;
    }
    document.title = [model && `${brand} ${model}`, !model && brand, "Sıfır Araç Fiyat Takibi"].filter(Boolean).join(" · ");
  }

  async function init() {
    try {
      const res = await fetch("data/cars.json", { cache: "no-cache" });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      cars = data.cars.map(enrich);
      $("updated").textContent = data.updated ? `son güncelleme: ${fmtDate(data.updated)}` : "henüz güncellenmedi";
      window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
      for (const ev of ["click", "pointerover"]) {
        $("list").addEventListener(ev, (e) => { if (e.target.matches?.(".hit")) showPoint(e.target); });
      }
      render();
    } catch (e) {
      $("list").innerHTML = `<p class="msg">Veri yüklenemedi (${esc(e.message)}).</p>`;
    }
  }

  init();
})();
  </script>
</body>
</html>
