<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sıfır Araç Fiyat Takibi</title>
  <meta name="description" content="Türkiye'de sıfır araç liste fiyatlarının haftalık takibi.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1><a href="#" class="home">Sıfır Araç Fiyat Takibi</a></h1>
      <p class="sub">Donanım bazında liste ve kampanyalı fiyatlar · haftalık güncellenir · <span id="updated">…</span></p>
    </div>
  </header>

  <main class="wrap">
    <nav id="crumbs" class="crumbs" aria-label="Konum"></nav>
    <h2 id="title" class="title"></h2>
    <div id="list" aria-live="polite"></div>
  </main>

  <footer class="wrap foot">
    Fiyatlar markaların yayımladığı aylık fiyat listelerinden derlenir; her fiyatın kaynak linki kartta yer alır.
    Kesin fiyat için yetkili bayiye danışın.
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
